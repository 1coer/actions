name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Create CI environment
        run: |
          echo "DB_USER=user" >> .env
          echo "DB_PASSWORD=password" >> .env
          echo "DB_NAME=dbname" >> .env

      - name: Build containers & start services
        run: docker compose -f compose.yml up -d

      - name: Run tests
        run: docker compose -f compose.yml run --rm api pytest

      - name: Shutdown
        if: always()
        run: docker compose -f compose.yml down -v
